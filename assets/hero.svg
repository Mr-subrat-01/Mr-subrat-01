<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Subrat Kumar Sahoo, Full Stack Developer. An animated request flows from React to a Node API, PostgreSQL, Gemini RAG and returns 200 OK." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2430"/>
    </pattern>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <rect width="900" height="250" rx="16" fill="#0b0f14"/>
    <rect width="900" height="250" rx="16" fill="url(#dots)"/>
    <rect x="0.5" y="0.5" width="899" height="249" rx="16" fill="none" stroke="#1f2a37"/>

    <text x="40" y="44" font-size="13" fill="#6b7a8d">GET / HTTP/1.1</text>
    <circle cx="790" cy="40" r="4" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="44" font-size="13" fill="#2dd4bf" text-anchor="end">200 OK</text>

    <text x="40" y="98" font-size="40" font-weight="700" fill="#e6edf3">Subrat Kumar Sahoo</text>
    <rect x="40" y="112" width="140" height="3" rx="1.5" fill="url(#g)"/>
    <text x="40" y="146" font-size="16" fill="#2dd4bf">Full Stack Developer · Node.js · TypeScript · React</text>

    <text x="40" y="170" font-size="11" fill="#6b7a8d" letter-spacing="2">REQUEST FLOW</text>

    <line x1="90" y1="196" x2="810" y2="196" stroke="#2a3645" stroke-width="2" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
    </line>

    <g font-size="13" text-anchor="middle">
      <rect x="35" y="177" width="110" height="38" rx="10" fill="#0f1620" stroke="#2a3645"/>
      <text x="90" y="201" fill="#c9d1d9">React</text>

      <rect x="215" y="177" width="110" height="38" rx="10" fill="#0f1620" stroke="#2a3645"/>
      <text x="270" y="201" fill="#c9d1d9">Node API</text>

      <rect x="395" y="177" width="110" height="38" rx="10" fill="#0f1620" stroke="#2a3645"/>
      <text x="450" y="201" fill="#c9d1d9">PostgreSQL</text>

      <rect x="575" y="177" width="110" height="38" rx="10" fill="#0f1620" stroke="#2a3645"/>
      <text x="630" y="201" fill="#c9d1d9">Gemini RAG</text>

      <rect x="755" y="177" width="110" height="38" rx="10" fill="#0f1620" stroke="#2dd4bf"/>
      <text x="810" y="201" fill="#2dd4bf">200 OK</text>
    </g>

    <circle r="11" fill="#f5a524" opacity="0.22">
      <animateMotion dur="4s" repeatCount="indefinite" path="M90 196 H810"/>
    </circle>
    <circle r="5" fill="#f5a524">
      <animateMotion dur="4s" repeatCount="indefinite" path="M90 196 H810"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
